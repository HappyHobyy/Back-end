<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>시스템 아키텍처</title>
  <desc>Flutter 프론트엔드, 백엔드 마이크로서비스, 외부 서비스 구성도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; fill: #555; }
      .c-teal rect   { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal text   { fill: #085041; }
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple text { fill: #3C3489; }
      .c-gray rect   { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray text   { fill: #444441; }
      .c-blue rect   { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue text   { fill: #0C447C; }
      .c-amber rect  { fill: #FAEEDA; stroke: #854F0B; }
      .c-amber text  { fill: #633806; }
      .c-coral rect  { fill: #FAECE7; stroke: #993C1D; }
      .c-coral text  { fill: #712B13; }
      .c-green rect  { fill: #EAF3DE; stroke: #3B6D11; }
      .c-green text  { fill: #27500A; }
      .c-pink rect   { fill: #FBEAF0; stroke: #993556; }
      .c-pink text   { fill: #72243E; }
    </style>
  </defs>

  <rect width="680" height="720" fill="#ffffff"/>

  <!-- Flutter Frontend -->
  <g class="c-teal">
    <rect x="260" y="20" width="160" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Flutter front-end</text>
  </g>

  <!-- Backend Docker Compose Container -->
  <rect x="30" y="100" width="500" height="430" rx="14" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="ts" x="44" y="120" dominant-baseline="central">Back-end · Docker Compose</text>

  <!-- API Gateway -->
  <g class="c-purple">
    <rect x="240" y="134" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="152" text-anchor="middle" dominant-baseline="central">API Gateway</text>
    <text class="ts" x="340" y="166" text-anchor="middle" dominant-baseline="central">:8000</text>
  </g>

  <!-- Eureka -->
  <g class="c-gray">
    <rect x="462" y="134" width="50" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="487" y="148" text-anchor="middle" dominant-baseline="central" style="font-size:11px">Eureka</text>
    <text class="ts" x="487" y="164" text-anchor="middle" dominant-baseline="central">:8761</text>
  </g>

  <!-- 4 Microservices -->
  <g class="c-blue">
    <rect x="50" y="242" width="100" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="100" y="263" text-anchor="middle" dominant-baseline="central">User</text>
    <text class="ts" x="100" y="279" text-anchor="middle" dominant-baseline="central">:8080</text>
  </g>
  <g class="c-blue">
    <rect x="175" y="242" width="100" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="225" y="263" text-anchor="middle" dominant-baseline="central">Text</text>
    <text class="ts" x="225" y="279" text-anchor="middle" dominant-baseline="central">:8081</text>
  </g>
  <g class="c-blue">
    <rect x="300" y="242" width="100" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="350" y="263" text-anchor="middle" dominant-baseline="central">Photo</text>
    <text class="ts" x="350" y="279" text-anchor="middle" dominant-baseline="central">:8082</text>
  </g>
  <g class="c-blue">
    <rect x="425" y="242" width="100" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="475" y="263" text-anchor="middle" dominant-baseline="central">Community</text>
    <text class="ts" x="475" y="279" text-anchor="middle" dominant-baseline="central">:8083</text>
  </g>

  <!-- MySQL -->
  <g class="c-amber">
    <rect x="215" y="390" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="315" y="408" text-anchor="middle" dominant-baseline="central">MySQL</text>
    <text class="ts" x="315" y="422" text-anchor="middle" dominant-baseline="central">:3306</text>
  </g>

  <!-- Legend -->
  <line x1="50" y1="468" x2="80" y2="468" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="88" y="472" dominant-baseline="central">직접 호출</text>
  <line x1="170" y1="468" x2="200" y2="468" stroke="#444" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="208" y="472" dominant-baseline="central">등록 / 메시지</text>

  <!-- FE → GW -->
  <line x1="340" y1="64" x2="340" y2="132" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- GW → Services -->
  <line x1="281" y1="178" x2="120" y2="240" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="310" y1="178" x2="235" y2="240" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="360" y1="178" x2="350" y2="240" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="178" x2="465" y2="240" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- GW -.-> Eureka -->
  <line x1="440" y1="156" x2="462" y2="156" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Services -.-> Eureka -->
  <path d="M100 242 Q100 210 487 178" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M225 242 Q225 215 487 178" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="475" y1="242" x2="487" y2="178" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Services → MySQL -->
  <line x1="100" y1="298" x2="220" y2="390" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="225" y1="298" x2="260" y2="388" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="350" y1="298" x2="330" y2="388" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="475" y1="298" x2="400" y2="388" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- External Services -->
  <g class="c-coral">
    <rect x="30" y="560" width="120" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="90" y="578" text-anchor="middle" dominant-baseline="central">RabbitMQ</text>
    <text class="ts" x="90" y="594" text-anchor="middle" dominant-baseline="central">external</text>
  </g>
  <g class="c-green">
    <rect x="175" y="560" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="225" y="582" text-anchor="middle" dominant-baseline="central">Amazon S3</text>
  </g>
  <g class="c-gray">
    <rect x="295" y="560" width="90" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="582" text-anchor="middle" dominant-baseline="central">SMTP</text>
  </g>
  <g class="c-pink">
    <rect x="405" y="560" width="110" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="460" y="574" text-anchor="middle" dominant-baseline="central">AI API</text>
    <text class="ts" x="460" y="590" text-anchor="middle" dominant-baseline="central">:8090</text>
  </g>
  <g class="c-pink">
    <rect x="535" y="560" width="110" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="590" y="574" text-anchor="middle" dominant-baseline="central">AI Model</text>
    <text class="ts" x="590" y="590" text-anchor="middle" dominant-baseline="central">Keras</text>
  </g>

  <!-- User -.-> RabbitMQ -->
  <path d="M100 530 L100 550 L90 550 L90 558" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- RabbitMQ -.-> Text, Photo, Community -->
  <path d="M90 604 L90 650 L225 650 L225 608" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M150 582 L162 582 L162 650 L350 650 L350 608" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M150 594 L164 594 L164 660 L475 660 L475 608" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Photo -.-> RabbitMQ -->
  <path d="M350 530 L350 545 L90 545 L90 558" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- User → SMTP -->
  <line x1="100" y1="530" x2="318" y2="562" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Services → S3 -->
  <line x1="100" y1="530" x2="196" y2="560" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="225" y1="530" x2="220" y2="558" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="350" y1="530" x2="245" y2="558" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="475" y1="530" x2="268" y2="560" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- FE → AI API -->
  <path d="M420 42 L590 42 L590 558" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- AI API -.-> AI Model -->
  <line x1="515" y1="582" x2="533" y2="582" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="524" y="572" text-anchor="middle" style="fill:#888">미구현</text>
</svg>
